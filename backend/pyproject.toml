[project]
name = "movie-platform-backend"
version = "0.1.0"
description = "Unified movie & series discovery backend (Phase 1 MVP)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Movie Platform Team" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.5",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "uvloop>=0.19.0",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-redis>=4.5.5",
]

[project.scripts]
mp-server = "app.main:app"
mp-worker = "app.workers.cli:worker_main"

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.alembic]
script_location = "app/migrations"
prepend_sys_path = "."
version_path_separator = "os"
