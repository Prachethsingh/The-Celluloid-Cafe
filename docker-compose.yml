services:
  # ==============================================================================
  # Primary PostgreSQL Database
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: movie-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-movie_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-movie_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Redis Cache & Background Tasks
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: movie-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # API Backend (Node / Hono + Vega Engine)
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: movie-platform-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      PLAYBACK_SIGNING_KEY: ${PLAYBACK_SIGNING_KEY:?Set a signing key of at least 32 characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-movie_platform}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80,http://localhost"
    ports:
      - "8000:8000"
    volumes:
      - apidata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==============================================================================
  # Web Frontend (Vite + React)
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: movie-platform-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  # ==============================================================================
  # Nginx Gateway / Reverse Proxy
  # ==============================================================================
  gateway:
    image: nginx:alpine
    container_name: movie-platform-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  apidata:
  pgdata:
  redisdata:
